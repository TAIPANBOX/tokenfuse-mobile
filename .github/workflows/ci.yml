name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the job be started by hand from the Actions tab or `gh workflow run CI`.
  # Without it the only way to exercise this workflow is to push something, which
  # is why the 2026-08-01 checkout fix sat unverified until 2026-08-08.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + test (iOS · watchOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build iPhone app (simulator · no signing)
        working-directory: ios
        run: |
          xcodebuild build \
            -project TokenFuse.xcodeproj \
            -scheme TokenFuse \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Test (on an available simulator)
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' || echo 'iPhone 16')
          echo "Testing on: $SIM"
          xcodebuild test \
            -project TokenFuse.xcodeproj \
            -scheme TokenFuse \
            -destination "platform=iOS Simulator,name=$SIM" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build watch app (simulator · no signing)
        working-directory: ios
        run: |
          xcodebuild build \
            -project TokenFuse.xcodeproj \
            -scheme TokenFuseWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
