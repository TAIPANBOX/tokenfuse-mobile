# XcodeGen project spec — the .xcodeproj is generated, not committed, so it
# stays reviewable as YAML (see docs/14-mobile-companion.md, ADR 14.6).
#   brew install xcodegen && cd mobile/ios && xcodegen generate
name: TokenFuse
options:
  bundleIdPrefix: com.taipanbox.tokenfuse
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No signing — simulator builds only until an Apple Developer account exists.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  TokenFuse:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    dependencies:
      - target: TokenFuseWidget
      # The watch app ships inside the phone app (D12 W4). It still runs on
      # its own once paired: embedding is how it is distributed and how
      # WatchConnectivity gets a counterpart, not a requirement that the phone
      # be nearby at runtime.
      - target: TokenFuseWatch
    info:
      path: Sources/Info.plist
      properties:
        # The name shown under the icon and in-app — matches the web dashboard.
        CFBundleDisplayName: TokenFuse
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Live Activities (Dynamic Island / Lock Screen), updated locally.
        NSSupportsLiveActivities: true
        # Allow cleartext HTTP to localhost / .local — dev planes run over HTTP;
        # production planes use HTTPS. Not arbitrary loads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # The relay is reached at whatever address the customer's own box
          # has, over a SELF-SIGNED certificate, and the app trusts it by SPKI
          # pin delivered in the QR the operator scanned off their desktop.
          # `NSAllowsArbitraryLoads` does not ship (security review,
          # 2026-09-06): per the finding below it never actually opened this
          # connection anyway, and PinnedTLS.swift's own SPKI check is what
          # protects the relay path regardless of that key.
          # No NSExceptionDomains entry ships, deliberately. One lived here
          # during the 2026-07-20 campaign, naming that box's address; it was
          # removed on 2026-07-21 when the box was destroyed. An exception
          # scoped to an address nobody owns any more grants this app nothing,
          # and would switch ATS's trust check off for whoever is assigned that
          # address next.
          #
          # The finding it came from is worth keeping, because it cost a live
          # session to learn: against a relay serving a SELF-SIGNED certificate,
          # pinning alone does not get the connection open.
          # NSAllowsArbitraryLoads only relaxes the cipher/version requirements
          # - the log said `enforce_ats(false) ... skip_ats_trust(false)` - and
          # CFNetwork still failed the task with -9802 AFTER the pin had already
          # matched. Only a host-scoped NSExceptionDomains entry turns ATS's own
          # trust check off.
          #
          # So if a future live batch points this app at a self-signed relay,
          # expect -9802, and add an exception for THAT batch's host as a
          # temporary diagnostic - never merged. The real fix is the cert broker
          # (genaryx task #14): once a relay serves a publicly-trusted
          # certificate there is nothing left for an exception to do.
        # Relay QR pairing scans a barcode with VisionKit's DataScannerViewController
        # (docs/PHASE5.md W3) — required or the app crashes on first camera access.
        NSCameraUsageDescription: "TokenFuse Pocket uses the camera to scan the pairing QR code shown on your Genaryx desktop."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taipanbox.tokenfuse
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
  TokenFuseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: Sources/DesignSystem.swift
      - path: Sources/Fuse.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: TokenFuse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taipanbox.tokenfuse.widget
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
  TokenFuseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TokenFuse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taipanbox.tokenfuse.tests
        GENERATE_INFOPLIST_FILE: YES
  # watchOS app — a standalone build for now (own bundle id, config via launch
  # args / UserDefaults); W2 turns it into an iPhone-companion over WatchConnectivity.
  # Reuses the design system, API layer and store from the iPhone sources.
  TokenFuseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
      - path: Sources/APIModels.swift
      - path: Sources/APIClient.swift
      - path: Sources/DesignSystem.swift
      - path: Sources/Fuse.swift
      # RunsStore + CachedRun are deliberately NOT here. They are the phone's
      # whole-fleet store (SwiftData cache over /v1/runs + /v1/budgets), and
      # the wrist reads only the relay's exception slice now, so pulling them
      # in would put a fleet browser back inside the watch binary. They remain
      # in the TokenFuse target via its `- path: Sources` directory entry.
      - path: Sources/LaunchArgs.swift
      - path: Sources/Crypto.swift
      - path: Sources/Keychain.swift
      - path: Sources/Session.swift
      # The kill ceremony's wrist-confirmation step (WatchRunKillView) is a
      # second Biometrics entry point alongside the phone's Face ID / passcode
      # gate; both live in this one file (extended, not duplicated).
      - path: Sources/Biometrics.swift
      # The relay client. Without these three the target did not even compile:
      # Session.swift references PinnedURLSessionDelegate and APIClient.swift
      # declares exceptions() -> ExceptionSnapshot, both of which lived only in
      # the phone's source list.
      - path: Sources/RelayModels.swift
      - path: Sources/RelayPairing.swift
      - path: Sources/PinnedTLS.swift
      # The pairing handoff from the phone (D12 W4).
      - path: Sources/WatchLink.swift
      # The wrist's exception store. It lives in Sources/ rather than
      # WatchApp/ for one reason: the iOS test bundle can only reach
      # types that TokenFuse compiles, and this class carries the
      # revocation rule (a 401 is not a network blip) that must never
      # regress untested.
      - path: Sources/WatchExceptionsStore.swift
    dependencies:
      - target: TokenFuseWatchComplication
    info:
      path: WatchApp/Info.plist
      properties:
        WKApplication: true
        # An iPhone companion since W4: the phone forwards the watch its own
        # pairing code over WatchConnectivity, because the watch has no camera
        # to scan the desktop QR with and watchOS has no CoreImage to render
        # one back. The app still runs independently once paired, it holds its
        # own token and its own signing key.
        WKCompanionAppBundleIdentifier: com.taipanbox.tokenfuse
        CFBundleDisplayName: TokenFuse
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Same reason as the phone: the watch is a relay client too, and
          # reaches the same self-signed, pin-trusted relay. No
          # `NSAllowsArbitraryLoads` here either, for the same reason as the
          # phone above (security review, 2026-09-06).
          # And no NSExceptionDomains entry here either, for the same reason
          # and with the same history as the phone above - see that comment for
          # the -9802 finding and what to do if a self-signed relay has to be
          # reached again. Without an exception the watch reproduces the phone's
          # failure exactly: pin matched, then -9802.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taipanbox.tokenfuse.watch
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: WatchApp/TokenFuseWatch.entitlements
  # Watch-face complication (WidgetKit) — the fleet's burn rate at a glance,
  # fed by the app over the app group. Embedded in the watch app.
  TokenFuseWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchComplication
      - path: WatchApp/FaceStore.swift
      - path: Sources/DesignSystem.swift
    info:
      path: WatchComplication/Info.plist
      properties:
        CFBundleDisplayName: TokenFuse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taipanbox.tokenfuse.watch.complication
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: WatchComplication/TokenFuseWatchComplication.entitlements
schemes:
  TokenFuse:
    build:
      targets:
        TokenFuse: all
    test:
      targets:
        - TokenFuseTests
  TokenFuseWatch:
    build:
      targets:
        TokenFuseWatch: all
